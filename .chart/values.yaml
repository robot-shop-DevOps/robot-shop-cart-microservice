labels:
  app: Cart
  project: Robot-Shop
  technology: NodeJs
  environment: default 

deployment:
  name: cart

  replicas: 1

  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1

  pod:
    nodeSelector:
      project: Robot-Shop

    containers:  
    - name: cart

      image: ${IMAGE}  # <-- placeholder

      imagePullPolicy: Always

      ports:
      - containerPort: 8326

      resources:
        requests:
          cpu: "50m"
          memory: "128Mi"

        limits:
          cpu: "200m"
          memory: "512Mi"

      env:
      - name: CART_SERVER_PORT 
        value: "8326"

      - name: REDIS_HOST  
        value: redis-service-headless.redis-database.svc.cluster.local
       
      - name: CATALOGUE_HOST
        value: catalogue.catalogue-microservice.svc.cluster.local

      - name: JWT_SECRET
        valueFrom:
          secretKeyRef:
            name: jwt
            key: JWT_SECRET

      readinessProbe:
        httpGet:
          path: /health
          port: 8326
        initialDelaySeconds: 5
        periodSeconds: 10
        failureThreshold: 3
        
      livenessProbe:
        httpGet:
          path: /health
          port: 8326
        initialDelaySeconds: 15
        periodSeconds: 20
        failureThreshold: 3


service:
  name: cart

  type: ClusterIP

  ports:
  - name: cart
    port: 8326
    targetPort: 8326